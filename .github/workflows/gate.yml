name: gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pasang dependensi
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Info lingkungan
        run: |
          python --version
          echo "traceroute: $(command -v traceroute || echo TIDAK ADA)"
          echo "node: $(command -v node || echo TIDAK ADA)"

      - name: make test
        run: make test 2>&1 | tee /tmp/make-test.log

      - name: make gate (make test + SEMUA verifier)
        run: make gate 2>&1 | tee /tmp/make-gate.log

      - name: Ringkasan
        if: always()
        run: |
          echo "== baris HASIL/RESULTS =="
          grep -hE "HASIL:|RESULTS:" /tmp/*.log 2>/dev/null | tail -n 40 || true
          echo "== verifier GAGAL =="
          grep -hE "^  GAGAL|^  FAIL|GAGAL " /tmp/make-gate.log 2>/dev/null || echo "(tidak ada)"

      - name: Unggah log bila gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-logs
          path: /tmp/*.log
          if-no-files-found: ignore
