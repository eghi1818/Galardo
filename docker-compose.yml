services:
  galardo:
    build: .
    image: galardo:local
    container_name: galardo-local
    ports:
      - "8090:8090"   # dashboard + API
      - "8095:8095"   # target lab
      - "8899:8899"   # shim override
    environment:
      GALARDO_BIND: "0.0.0.0"
      GALARDO_DEV_TOKEN: "${GALARDO_DEV_TOKEN:-dev-token}"
      GALARDO_NATS_URL: "nats://nats:4222"
      GALARDO_OTLP_URL: "http://otel:4318"
      GALARDO_PG_DSN: "postgres://galardo:galardo@pg:5432/galardo"
    volumes:
      - ./data:/app/data
    env_file:
      - path: .env
        required: false
    depends_on:
      - nats
      - otel
      - pg
    restart: unless-stopped

  nats:
    image: nats:2.10-alpine
    container_name: galardo-nats
    command: ["-js", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    restart: unless-stopped

  otel:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: galardo-otel
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./ops/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"
    restart: unless-stopped

  pg:
    image: postgres:16-alpine
    container_name: galardo-pg
    environment:
      POSTGRES_USER: galardo
      POSTGRES_PASSWORD: galardo
      POSTGRES_DB: galardo
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U galardo -d galardo"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  pgdata:
